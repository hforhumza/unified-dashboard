<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy your first Managed AI Agent · Cloudways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--heading:#253858;--body:#4b5971;--muted:#5e6c84;--brand:#2f39bf;--brand-soft:#eaebf9;--brand-20:#d5d7f2;--border:#eff0f3;--border2:#dfe1e6;--field:#c1c7d0;--sel:#fbfbfe}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--heading);background:#fff;font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
img{display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* shell (same as dashboard) */
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;position:fixed;top:0;left:0;right:0;background:#fff;z-index:10}
.topbar .logo{width:147px;height:28px}
.top-right{display:flex;align-items:center;gap:24px;font-size:12px}
.refer{display:flex;align-items:center;gap:6px}
.refer img{width:20px;height:20px}
.vline{width:1px;height:30px;background:var(--border2)}
.top-right .icons{width:132px;height:24px}
.user{display:flex;align-items:center;gap:8px}
.user .avatar{width:30px;height:30px;border-radius:50%}
.user .chev{width:22px;height:20px}
.side{position:fixed;top:48px;left:0;bottom:0;width:88px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:20px 0;background:#fff;z-index:9}
.side nav{display:flex;flex-direction:column;align-items:center;gap:12px}
.side a{display:block}
.stage{position:fixed;top:48px;left:0;right:0;bottom:89px;overflow:auto;
  background:radial-gradient(900px 420px at 62% -80px,rgba(101,101,248,.22),rgba(15,175,255,.06) 55%,transparent 75%),radial-gradient(700px 360px at 20% -60px,rgba(148,80,253,.12),transparent 70%),#fff}
.col{width:820px;max-width:100%;margin:0 auto;padding:32px 0 40px}
h1{font-size:20px;font-weight:600;line-height:36px;margin-top:0}
.stepl{font-size:13px;font-weight:500;line-height:20px;color:var(--brand);margin-top:24px;display:flex;align-items:center;gap:16px;min-height:24px}
.back{display:flex;align-items:center;gap:2px;color:var(--brand);font-size:14px;font-weight:400;height:24px}
.back img{width:14px;height:14px}
.vr{width:1px;height:18px;background:var(--border2)}
.f{margin-top:24px}
.f:first-of-type{margin-top:16px}
.t{font-size:14px;font-weight:500;line-height:21px}
.s{font-size:13px;line-height:20px;color:var(--muted);margin-top:2px}
.in{display:block;width:100%;height:48px;margin-top:16px;border:1px solid var(--field);border-radius:4px;padding:0 12px;font-size:13px;background:#fff;outline:0;transition:border-color .15s,box-shadow .15s}
.in::placeholder{color:#8993a4}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,57,191,.12)}
.err .in{border-color:#d92d20}
.msg{display:none;font-size:11px;color:#d92d20;margin-top:4px}
.err .msg{display:block}

/* agents */
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}
.ag{position:relative;background:#fff;border:1px solid var(--border);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:11px;justify-content:center;min-height:92px;transition:border-color .15s}
.ag img.i{width:40px;height:40px}
.ag b{display:block;font-size:14px;font-weight:500;line-height:21px}
.ag span{display:block;font-size:11px;line-height:16px;color:var(--muted)}
.ag.on{background:var(--sel);border-color:var(--brand)}
.ag:not(.lk):not(.on):hover{border-color:#b3b9c4}
.ag.lk{cursor:not-allowed}
.ag .lock{position:absolute;right:12px;top:11px;width:16px;height:16px}
.regs{display:grid;grid-template-columns:repeat(4,1fr);gap:17px 16px;margin-top:20px}
.reg{background:#fff;border:1px solid var(--border2);border-radius:4px;padding:12px 12px;display:flex;align-items:center;gap:9px;font-size:12px;line-height:20px;transition:border-color .15s}
.reg:hover{border-color:#b3b9c4}
.reg.on{background:var(--sel);border-color:var(--brand)}
.reg img{width:22px;height:16px;object-fit:cover}

/* sizes / providers */
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.sz{background:#fff;border:1px solid var(--border2);border-radius:4px;padding:16px;min-height:192px;transition:border-color .15s,box-shadow .15s}
.sz:hover{border-color:#b3b9c4}
.sz.on{border-color:var(--brand);background:var(--sel);box-shadow:0 0 0 1px var(--brand)}
.sz h4{font-size:13px;font-weight:500;line-height:20px}
.sz .d{font-size:11px;line-height:16px;color:var(--muted);margin-top:2px;min-height:32px}
.sz .p{font-size:20px;font-weight:600;line-height:28px;color:var(--brand);margin-top:8px}
.sz .p small{font-size:11px;font-weight:400;color:var(--body);margin-left:3px}
.sz ul{list-style:none;border-top:1px solid var(--border2);margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:11px;line-height:16px}
.sz li::before{content:"•";margin-right:8px}
.provs{display:flex;gap:16px;margin-top:16px}
.pv{background:#fff;border:1px solid var(--border2);border-radius:4px;height:40px;width:121px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;transition:border-color .15s}
.pv:hover{border-color:#b3b9c4}
.pv.on{border-color:var(--brand);background:var(--sel)}
.pv img{width:20px;height:20px}
.key{margin-top:16px}
.key label{font-size:13px;line-height:20px}
.terms{font-size:13px;line-height:20px;margin-top:24px}
.terms a{text-decoration:underline;cursor:pointer}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;height:89px;border-top:1px solid var(--brand-20);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:8;gap:24px}
.fl{display:flex;align-items:center;gap:20px;min-width:0}
.fl>img{width:40px;height:40px}
.fl b{display:block;font-size:13px;font-weight:600;line-height:20px;white-space:nowrap}
.loc{display:flex;align-items:center;gap:4px;font-size:12px;line-height:18px;color:var(--body);margin-top:6px}
.loc img{width:17px;height:12px;object-fit:cover}
.fvr{width:1px;height:46px;background:var(--border2)}
.spec{display:flex;gap:28px;font-size:12px;line-height:18px;white-space:nowrap}
.spec div{display:flex;flex-direction:column;gap:8px}
.spec b{display:inline;font-size:12px;font-weight:500}
.fr{display:flex;align-items:center;gap:32px}
.pr{text-align:center;font-size:12px;line-height:18px}
.pr b{display:block;font-size:16px;font-weight:600;line-height:24px}
.cta{height:40px;padding:0 16px;border-radius:4px;background:var(--brand);color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;transition:background .15s;white-space:nowrap}
.cta:hover{background:#252ea3}
.cta img{width:16px;height:16px}
.launch{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.launch h2{font-size:20px;font-weight:600;line-height:28px}
.launch p{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#253858;color:#fff;font-size:13px;padding:10px 18px;border-radius:4px;z-index:50}
@media(max-width:1100px){.col{padding:24px 24px 40px;width:100%}.sizes{grid-template-columns:repeat(2,1fr)}.spec{display:none}.fvr{display:none}}
@media(max-width:760px){.agents,.regs{grid-template-columns:repeat(2,1fr)}.agents{gap:12px}.provs{flex-wrap:wrap}.side{display:none}.top-right .refer,.top-right .vline,.top-right .icons{display:none}.sizes{grid-template-columns:1fr}.foot{padding:0 16px}.fr{gap:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" aria-label="Cloudways home"><img class="logo" src="assets/logo.png?v=4" alt="Cloudways by DigitalOcean"></a>
  <div class="top-right">
    <a class="user" href="login.html" title="Log out" aria-label="John Doe, log out"><img class="avatar" src="assets/avatar.png" alt=""><img class="chev" src="assets/chevron.svg" alt=""></a>
  </div>
</header>
<a href="launchpad.html" aria-label="Close" style="position:fixed;top:60px;right:20px;z-index:11;width:24px;height:24px;display:grid;place-items:center;border-radius:50%"><img src="assets/agents-onb/close.svg" alt="" width="22" height="22"></a>
<main class="stage" id="stage"></main>
<footer class="foot" id="foot"></footer>

<script>
const G='assets/agents-onb/',O='assets/onboarding/';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const REGIONS=[['ny','New York','flag-us'],['ia','Iowa','flag-us'],['lon','London','flag-uk'],['fra','Frankfurt','flag-de'],['blr','Bangalore','flag-in'],['sgp','Singapore','flag-sg'],['tyo','Tokyo','flag-id'],['syd','Sydney','flag-au']];
const flagSrc=f=>(f==='flag-id'?G:O)+f+'.svg';
const SIZES=[
 {id:'scout',name:'Scout',d:'light reconnaissance, one or two simple workflows',price:4.99,ram:2,cpu:1,disk:50,bw:2},
 {id:'operator',name:'Operator',d:'active single-purpose agent doing real work',price:9.99,ram:4,cpu:2,disk:80,bw:4},
 {id:'squad',name:'Squad',d:'multiple sub-agents coordinating on tasks',price:19.99,ram:8,cpu:4,disk:160,bw:5},
 {id:'swarm',name:'Swarm',d:'heavy workloads with many agents running in parallel',price:39.99,ram:16,cpu:8,disk:320,bw:6}
];
const PROVS=[['openai','OpenAI','sk-…'],['anthropic','Anthropic','sk-ant-…'],['gemini','Gemini','AIza…']];

const S={view:1,name:'',region:'ny',size:'scout',prov:'openai',key:''};
const reg=()=>REGIONS.find(r=>r[0]===S.region), size=()=>SIZES.find(z=>z.id===S.size);

function step1(){
  return `<div class="col"><h1>Deploy your first Managed AI Agent</h1>
  <div class="stepl">Step 1 of 2</div>
  <div class="f" id="f-name"><label class="t" for="aname">Agent Name</label><p class="s">Give your agent a name you’ll recognise. You can change it anytime later.</p>
    <input class="in" id="aname" value="${esc(S.name)}" placeholder="Agent Name Here" maxlength="60" autocomplete="off"><p class="msg">Give your agent a name.</p></div>
  <div class="f"><div class="t">Your Agent</div><p class="s">Decide on the server that best fits your needs, ensuring your application runs smoothly.</p>
    <div class="agents" role="radiogroup" aria-label="Agent">
      <button class="ag on" role="radio" aria-checked="true" data-agent="openclaw"><img class="i" src="${G}openclaw.svg" alt=""><span style="color:inherit"><b>OpenClaw</b><span>Managed AI Agent</span></span></button>
      <button class="ag lk" role="radio" aria-checked="false" aria-disabled="true" data-agent="nemoclaw"><img class="i" src="${G}nemoclaw.svg" alt=""><span><b>NemoClaw</b><span>Vision-aware ops agent</span></span><img class="lock" src="${G}lock.svg" alt="Locked"></button>
      <button class="ag lk" role="radio" aria-checked="false" aria-disabled="true" data-agent="hermes"><img class="i" src="${G}hermes.svg" alt=""><span><b>Hermes</b><span>Coming Soon</span></span><img class="lock" src="${G}lock.svg" alt="Locked"></button>
    </div></div>
  <div class="f"><div class="t">Select Region</div><p class="s">Choose a server location closest to your target audience for faster load times and better performance.</p>
    <div class="regs" role="radiogroup" aria-label="Region">${REGIONS.map(([k,n,f])=>`<button class="reg${k===S.region?' on':''}" role="radio" aria-checked="${k===S.region}" data-region="${k}"><img src="${flagSrc(f)}" alt="">${n}</button>`).join('')}</div></div></div>`;
}
function step2(){
  const p=PROVS.find(x=>x[0]===S.prov);
  return `<div class="col"><h1>Deploy your first Managed AI Agent</h1>
  <div class="stepl" style="margin-top:32px;font-size:14px"><button class="back" data-go="1"><img src="${G}chev-left.svg" alt="">Back</button><span class="vr"></span>Step 2 of 2</div>
  <div class="f" style="margin-top:32px"><div class="t" style="font-size:16px">Server Size</div><p class="s">Pick the droplet size for this agent. RAM determines how much concurrent chat traffic OpenClaw can handle — you can resize later.</p>
    <div class="sizes" role="radiogroup" aria-label="Server size">${SIZES.map(z=>`<button class="sz${z.id===S.size?' on':''}" role="radio" aria-checked="${z.id===S.size}" data-size="${z.id}"><h4>${z.name}</h4><p class="d">${z.d}</p><div class="p">$${z.price}<small>/mo</small></div>
      <ul><li>${z.ram} GB RAM</li><li>${z.cpu} vCPU</li><li>${z.disk} GB SSD Storage</li><li>${z.bw} TB Bandwidth</li></ul></button>`).join('')}</div></div>
  <div class="f" style="margin-top:32px"><div class="t" style="font-size:16px">Select AI Provider</div><p class="s">OpenClaw uses your API key to power AI features. Your key is encrypted end-to-end and never shared.</p>
    <div class="provs" role="radiogroup" aria-label="AI provider">${PROVS.map(([k,n])=>`<button class="pv${k===S.prov?' on':''}" role="radio" aria-checked="${k===S.prov}" data-prov="${k}"><img src="${G}${k}.svg" alt="">${n}</button>`).join('')}</div>
    <div class="key" id="f-key"><label for="akey">API key</label><input class="in" id="akey" type="password" style="margin-top:8px" value="${esc(S.key)}" placeholder="${p[1]} API key (${p[2]})" autocomplete="off" spellcheck="false"><p class="msg">Enter your ${p[1]} API key.</p></div></div>
  <p class="terms">By deploying agent, you accept our <a>Terms and Conditions</a></p></div>`;
}
function foot(){
  const r=reg(),z=size();
  const left=`<div class="fl"><img src="${G}openclaw.svg" alt=""><div><b>OpenClaw Agent${S.name.trim()?' · '+esc(S.name.trim()):''}</b><div class="loc"><img src="${flagSrc(r[2])}" alt="">${r[1]}</div></div>
    ${S.view===2?`<span class="fvr"></span><div class="spec"><div><span>RAM: <b>${z.ram} GB</b></span><span>Disk: <b>${z.disk} GB</b></span></div><div><span>CPU: <b>${z.cpu} ${z.cpu===1?'Core':'Cores'} Processor</b></span><span>Bandwidth: <b>${z.bw} TB</b></span></div></div>`:''}</div>`;
  const right=S.view===1?`<button class="cta" id="next" style="padding:0 16px 0 20px">Continue<img src="${G}arrow.svg" alt=""></button>`
    :`<div class="fr"><div class="pr"><b>$${z.price.toFixed(2)}</b>Monthly</div><button class="cta" id="next">Deploy Agent</button></div>`;
  return left+right;
}
function render(){
  $('#stage').innerHTML=S.view===1?step1():step2();
  $('#foot').innerHTML=foot();
  $('#stage').scrollTop=0;
}
function refreshFoot(){$('#foot').innerHTML=foot()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-region],[data-agent],[data-go],[data-size],[data-prov],#next');if(!t)return;
  const d=t.dataset;
  if(d.region){S.region=d.region;S.name=$('#aname').value;render();return}
  if(d.agent){if(d.agent!=='openclaw')toast(d.agent==='hermes'?'Hermes is coming soon.':'NemoClaw isn’t available yet.');return}
  if(d.go){S.view=+d.go;render();return}
  if(d.size){S.size=d.size;S.key=$('#akey').value;render();return}
  if(d.prov){S.prov=d.prov;S.key=$('#akey').value;render();return}
  if(t.id==='next')advance();
});
document.addEventListener('input',e=>{
  if(e.target.id==='aname'){S.name=e.target.value;$('#f-name').classList.remove('err');refreshFoot()}
  if(e.target.id==='akey'){S.key=e.target.value;$('#f-key').classList.remove('err')}
});
function advance(){
  if(S.view===1){
    if(!S.name.trim()){$('#f-name').classList.add('err');$('#aname').focus();return}
    S.view=2;render();return;
  }
  if(!S.key.trim()){$('#f-key').classList.add('err');$('#akey').focus();return}
  const z=size(),o=document.createElement('div');o.className='launch';o.setAttribute('role','status');
  o.innerHTML=`<div class="spin"></div><h2>Deploying ${esc(S.name.trim())}…</h2><p>Setting up your OpenClaw agent on a ${z.name} server in ${reg()[1]}.</p>`;
  document.body.appendChild(o);
  try{sessionStorage.setItem('cw_agent',JSON.stringify({name:S.name.trim(),size:S.size,region:S.region,provider:S.prov}))}catch{} // the API key is never stored
  setTimeout(()=>{location.href='index.html'},2200);
}
function toast(t){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
if(location.hash==='#hermes')setTimeout(()=>toast('Hermes is coming soon. Start with OpenClaw for now.'),300);
render();
</script>
</body>
</html>
