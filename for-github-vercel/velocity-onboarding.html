<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy your first Node.js application · Cloudways Velocity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--heading:#253858;--body:#4b5971;--muted:#5e6c84;--brand:#2f39bf;--brand-soft:#eaebf9;--brand-20:#d5d7f2;--border:#eff0f3;--border2:#dfe1e6;--field:#c1c7d0;--sel:#f5f5fc;--green:#00875a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--heading);background:#fff;font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
img{display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* shell (same as dashboard) */
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;position:fixed;top:0;left:0;right:0;background:#fff;z-index:10}
.topbar .logo{width:147px;height:28px}
.top-right{display:flex;align-items:center;gap:24px;font-size:12px}
.refer{display:flex;align-items:center;gap:6px}
.refer img{width:20px;height:20px}
.vline{width:1px;height:30px;background:var(--border2)}
.top-right .icons{width:132px;height:24px}
.user{display:flex;align-items:center;gap:8px}
.user .avatar{width:30px;height:30px;border-radius:50%}
.user .chev{width:22px;height:20px}
.side{position:fixed;top:48px;left:0;bottom:0;width:88px;border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:20px 0;background:#fff;z-index:9}
.side nav{display:flex;flex-direction:column;align-items:center;gap:12px}
.side a{display:block}
.side a.on{background:var(--sel);border-radius:4px}
.stage{position:fixed;top:48px;left:0;right:0;bottom:89px;overflow:auto;background:linear-gradient(180deg,#eef0ff 0,#fff 220px)}
.inner{padding:46px 62px 40px;max-width:1260px}
.inner.narrow{max-width:752px;margin:0 auto;padding:48px 0 40px}
h1{font-size:24px;font-weight:600;line-height:36px}
.lead{font-size:14px;line-height:22px;color:var(--body);margin-top:8px}
.stepl{font-size:14px;font-weight:500;color:var(--brand);margin-top:32px;display:flex;align-items:center;gap:16px}
.back{display:flex;align-items:center;gap:2px;color:var(--brand);font-size:14px;font-weight:400;height:24px}
.back img{width:20px;height:20px}
.vr{width:1px;height:18px;background:var(--border2)}

/* plans */
.plans{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:28px;max-width:1139px}
.plan{background:#fff;border:1px solid var(--border2);border-radius:4px;padding:20px 16px;min-height:172px;transition:border-color .15s,box-shadow .15s;display:block;width:100%}
.plan:hover{border-color:#b3b9c4}
.plan.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.pnm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;line-height:21px}
.pill{border:1px solid var(--border2);border-radius:20px;padding:0 8px;font-size:11px;font-weight:400;line-height:19px;white-space:nowrap}
.pp{font-size:24px;font-weight:600;line-height:32px;color:var(--brand);margin-top:12px}
.pp small{font-size:12px;font-weight:400;color:var(--body);margin-left:6px}
.sp{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:11px;line-height:18px}
.sp b{font-size:12px;font-weight:500;margin-left:4px}
.incl{margin-top:32px;max-width:1139px;background:#fbfbfe;border-radius:4px;display:flex;padding:17px 12px;gap:34px;align-items:stretch}
.incl h4,.chg h4{font-size:12px;font-weight:600;line-height:18px}
.incl .l{display:flex;gap:42px;margin-top:8px;font-size:12px;line-height:18px;white-space:nowrap}
.incl .l span{display:flex;align-items:center;gap:5px}
.incl .l svg{width:16px;height:16px}
.incl .sep{width:1px;background:var(--border2)}
.chg{font-size:13px;line-height:20px}
.chg p{display:flex;align-items:center;gap:8px;margin-top:8px;white-space:nowrap}
.chg i{width:7px;height:7px;border-radius:50%;background:var(--border2)}
.disk{max-width:1139px;margin-top:40px}
.disk h3{font-size:14px;font-weight:500;line-height:21px}
.disk p{font-size:13px;line-height:20px;color:var(--body);margin-top:4px}
.dr{display:flex;align-items:center;gap:11px;margin-top:20px}
.rw{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:13px;border-radius:7px;background:linear-gradient(90deg,var(--brand) var(--p,1%),#eceefc var(--p,1%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#091e42;border:0;box-shadow:0 0 0 0 rgba(47,57,191,.2);transition:box-shadow .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(47,57,191,.15)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#091e42;border:0}
.rl{display:flex;justify-content:space-between;font-size:12px;line-height:18px;margin-top:12px}
.dnum{display:flex;align-items:center;gap:7px;font-size:14px}
.dnum input{width:90px;height:40px;border:1px solid var(--field);border-radius:4px;padding:0 12px;font-size:14px;outline:0}
.dnum input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,57,191,.12)}
.imp{font-size:12px;line-height:17px;color:var(--body);margin-top:32px;max-width:1139px}

/* region */
.f{margin-top:32px}
.f label,.f .t{display:block;font-size:14px;font-weight:500;line-height:21px}
.f .s{font-size:13px;line-height:20px;color:var(--body);margin-top:4px}
.in{display:block;width:100%;max-width:864px;height:48px;margin-top:16px;border:1px solid var(--field);border-radius:4px;padding:0 12px;font-size:14px;background:#fff;outline:0;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,57,191,.12)}
.err .in{border-color:#d92d20}
.msg{display:none;font-size:11px;color:#d92d20;margin-top:4px}
.err .msg{display:block}
.regs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;max-width:864px}
.reg{background:#fff;border:1px solid var(--border2);border-radius:4px;height:48px;padding:0 12px;display:flex;align-items:center;gap:9px;font-size:12px;transition:border-color .15s}
.reg:hover{border-color:#b3b9c4}
.reg.on{background:var(--sel);border-color:var(--brand)}
.reg img{width:22px;height:16px;object-fit:cover}

/* git */
.gbox{background:#fff;border:1px solid var(--border);border-radius:4px;padding:16px;margin-top:32px;min-height:552px}
.gbox .t{font-size:13px;font-weight:500;line-height:20px}
.gbox .s{font-size:12px;line-height:18px;color:var(--body);margin-top:4px}
.provs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.prov{background:#fff;border:1px solid var(--border2);border-radius:4px;height:48px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:13px;position:relative;transition:border-color .15s}
.prov:hover{border-color:#b3b9c4}
.prov.on{background:var(--sel);border-color:var(--brand)}
.prov img{width:24px;height:24px;object-fit:contain}
.prov .ok{position:absolute;right:12px;top:16px;width:16px;height:16px}
.prov .ok img{position:absolute;inset:0;width:16px;height:16px}
.prov .ok img+img{inset:1.45px;width:13.1px;height:13.1px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;margin:56px auto 0;max-width:468px}
.empty img{width:113px;height:80px}
.empty h4{font-size:14px;font-weight:500;line-height:21px;margin-top:24px}
.empty p{font-size:12px;line-height:17px;color:var(--body);margin-top:4px}
.empty .cn{margin-top:28px;height:32px;padding:0 20px;border:1px solid var(--brand);border-radius:4px;color:var(--brand);font-size:12px;font-weight:500;transition:background .15s}
.empty .cn:hover{background:var(--brand-soft)}
.acct{margin-top:24px;background:#fbfbfe;border-radius:4px;padding:8px;display:flex;align-items:center;justify-content:space-between}
.acct>div{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500}
.acct .av{width:32px;height:32px;border:.7px solid var(--border2);border-radius:50%;display:grid;place-items:center;background:#fff}
.acct .av img{width:16px;height:16px}
.acct button{width:20px;height:20px}
.wsh{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.wsh b{font-size:13px;font-weight:500}
.wsh button{width:20px;height:20px}
.sel{position:relative;margin-top:10px}
.sel select{width:100%;height:48px;border:1px solid var(--border2);border-radius:4px;padding:0 40px 0 12px;font-size:13px;background:#fff;appearance:none;-webkit-appearance:none;cursor:pointer;outline:0}
.sel select:focus{border-color:var(--brand)}
.sel img{position:absolute;right:12px;top:14px;width:20px;height:20px;pointer-events:none}
.rc{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:12px;color:var(--body)}
.rc button{width:20px;height:20px}
.repos{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.repo{width:100%;height:51px;border:1px solid var(--border2);border-radius:4px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:13px;background:#fff;transition:border-color .15s,background .15s}
.repo:hover{border-color:#b3b9c4}
.repo.on{border-color:var(--brand);background:var(--sel)}
.repo img{width:24px;height:24px}
.repo .none{font-size:13px;color:var(--body)}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;height:89px;border-top:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 66px;z-index:8;gap:24px}
.foot.g{padding:0 32px 0 24px}
.sel-plan{display:flex;align-items:center;gap:16px}
.sel-plan .l{font-size:13px;line-height:20px}
.sel-plan .l b{display:block;font-size:14px;font-weight:500;color:var(--brand);margin-top:6px;line-height:21px}
.sel-plan .l+.v{width:1px;height:46px;background:var(--border2);margin:0 8px}
.spec{display:flex;gap:24px;font-size:12px;line-height:18px}
.spec div{display:flex;flex-direction:column;gap:8px}
.spec b{font-weight:500}
.fr{display:flex;align-items:center;gap:32px}
.pr{text-align:center;font-size:12px;line-height:18px}
.pr b{display:block;font-size:14px;font-weight:600;line-height:20px}
.cta{height:40px;padding:0 20px;border-radius:4px;background:var(--brand);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;transition:background .15s,opacity .15s;white-space:nowrap}
.cta:hover:not(:disabled){background:#252ea3}
.cta:disabled{background:var(--brand-20);cursor:not-allowed}
.cta img{width:20px;height:20px}
.gback{display:flex;align-items:center;gap:6px;color:var(--brand);font-size:16px;height:40px;padding:0 12px}
.gback img{width:20px;height:20px}

/* github sign-in mock */
.scrim{position:fixed;inset:0;background:rgba(9,30,66,.5);z-index:30;display:grid;place-items:center;padding:20px}
.win{width:476px;max-width:100%;background:#0d1117;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wb{height:34px;background:#2b2e33;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:#c9d1d9}
.wb i{width:12px;height:12px;border-radius:50%;display:block}
.wb span{margin-left:6px}
.url{height:34px;background:#1c2128;border-bottom:1px solid #30363d;padding:0 12px;display:flex;align-items:center;font-size:12px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh{padding:32px 48px 28px;text-align:center}
.gh .lg{width:76px;height:76px;border-radius:50%;background:#fff;margin:0 auto;display:grid;place-items:center}
.gh .lg span{width:40px;height:40px;background:#111;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1}
.gh h5{font-size:14px;font-weight:400;margin-top:20px;line-height:20px}
.gh form{text-align:left;margin-top:26px}
.gh label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
.gh label a{color:#58a6ff;font-weight:400;font-size:12px}
.gh input{width:100%;height:32px;border-radius:6px;border:1px solid #30363d;background:#0d1117;margin-bottom:16px;padding:0 12px;color:#e6edf3;font-size:14px;outline:0}
.gh input:focus{border-color:#2f81f7;box-shadow:0 0 0 3px rgba(47,129,247,.3)}
.gh .si{width:100%;height:36px;border-radius:6px;background:#3f8f46;color:#fff;font-weight:600;font-size:14px;text-align:center;border:1px solid rgba(240,246,252,.1)}
.gh .si:hover{background:#2f7a37}
.gh .or{display:flex;align-items:center;gap:12px;font-size:12px;color:#8b949e;margin:20px 0}
.gh .or::before,.gh .or::after{content:"";flex:1;height:1px;background:#30363d}
.gh .alt{display:block;width:100%;height:36px;border:1px solid #30363d;background:#21262d;border-radius:6px;color:#e6edf3;text-align:center;line-height:34px;font-size:14px;margin-bottom:8px}
.gh .alt:hover{background:#30363d}
.gh small{display:block;text-align:center;font-size:13px;margin-top:14px}
.gh small a{color:#58a6ff}
.gh .pn{text-align:center;font-size:11px;color:#8b949e;margin-top:18px}
.launch{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.launch h2{font-size:20px;font-weight:600;line-height:28px}
.launch p{font-size:13px;color:var(--muted)}
@media(max-width:1100px){.plans{grid-template-columns:repeat(2,1fr)}.inner{padding:32px 24px}.incl{flex-direction:column}.incl .sep{display:none}.regs{grid-template-columns:repeat(2,1fr)}.provs{grid-template-columns:1fr}.spec{display:none}.chg p{flex-wrap:wrap;white-space:normal}.incl .l{flex-wrap:wrap;gap:12px 24px}}
@media(max-width:700px){.side{display:none}.top-right .refer,.top-right .vline,.top-right .icons{display:none}.inner{padding:24px 16px}.sel-plan .l+.v{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}

/* ---- spacing / layout polish ---- */
.stage{scroll-padding-top:24px}
.inner{max-width:1180px;margin:0 auto;padding:44px 62px 56px}
.inner.narrow{max-width:752px;padding:44px 0 56px}
h1{font-size:22px;line-height:32px;letter-spacing:-.1px}
.lead{margin-top:6px;font-size:14px;line-height:22px}
.stepl{margin-top:28px;font-size:13px;letter-spacing:.2px;text-transform:uppercase;color:var(--brand)}
.stepl .back{text-transform:none;letter-spacing:0}
.plans{max-width:none;margin-top:20px;gap:20px}
.plan{padding:22px 20px 20px;min-height:0}
.pnm{font-size:15px;line-height:22px;min-height:22px}
.pp{margin-top:10px;font-size:26px;line-height:34px}
.pp small{font-size:13px}
.sp{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);gap:10px;font-size:12px;line-height:18px;color:var(--muted)}
.sp span{display:flex;justify-content:space-between;gap:8px}
.sp b{margin:0;color:var(--heading);text-align:right}
.incl{max-width:none;margin-top:28px;padding:20px 24px;gap:40px;border:1px solid var(--border);background:#fbfbfe}
.incl h4,.chg h4{font-size:13px;line-height:20px}
.incl .l{margin-top:10px;gap:36px;font-size:13px}
.chg{flex:1;min-width:0}
.chg p{margin-top:10px;font-size:13px;flex-wrap:wrap;white-space:normal;gap:6px 10px;line-height:20px}
.incl .l{flex-shrink:0}
.disk{max-width:none;margin-top:44px}
.disk h3{font-size:16px;line-height:24px}
.disk p{margin-top:4px}
.dr{margin-top:28px;gap:24px}
.rl{margin-top:14px;color:var(--muted)}
.dnum input{width:96px;height:44px}
.imp{max-width:none;margin-top:28px;padding:12px 16px;border-radius:4px;background:#f6f6fa;font-size:12px;line-height:18px}
.f{margin-top:32px}
.in,.regs{max-width:none}
.regs{margin-top:20px}
.foot{padding:0 max(32px,calc((100vw - 1180px)/2 + 62px)) 0 max(32px,calc((100vw - 1180px)/2 + 62px));gap:32px}
.foot.g{padding:0 32px 0 24px}
.sel-plan{gap:20px}
.spec{gap:36px}
.spec div{gap:10px}
.close{position:fixed;top:60px;right:20px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;z-index:11;transition:background .2s,transform .3s}
.close:hover{background:rgba(9,30,66,.07);transform:rotate(90deg)}
.close img{width:22px;height:22px}
@media(max-width:1100px){.plans{gap:16px}.inner{padding:32px 24px 48px}.foot{padding:0 24px}}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" aria-label="Cloudways home"><img class="logo" src="assets/logo.png?v=4" alt="Cloudways by DigitalOcean"></a>
  <div class="top-right">
    <a class="user" href="login.html" title="Log out" aria-label="John Doe, log out"><img class="avatar" src="assets/avatar.png" alt=""><img class="chev" src="assets/chevron.svg" alt=""></a>
  </div>
</header>
<a class="close" href="launchpad.html" aria-label="Close"><img src="assets/agents-onb/close.svg" alt=""></a>
<main class="stage" id="stage"></main>
<footer class="foot" id="foot"></footer>

<script>
const V='assets/velocity-onb/',O='assets/onboarding/';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK='<svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-6.5" stroke="#2f39bf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const PLANS=[
 {id:'starter',name:'Starter',pill:'3 Day Free Trial',price:20,cpu:2,ram:2,cdn:500},
 {id:'pro',name:'Professional',price:30,cpu:2,ram:4,cdn:200},
 {id:'growth',name:'Growth',price:50,cpu:4,ram:8,cdn:400},
 {id:'scale',name:'Scale',price:100,cpu:8,ram:16,cdn:400},
 {id:'plus',name:'Plus',price:150,cpu:8,ram:32,cdn:500}
];
const REGIONS=[['ny','New York','flag-us'],['ams','Amsterdam','flag-nl'],['sf','San Francisco','flag-us'],['lon','London','flag-uk'],['blr','Bangalore','flag-in'],['fra','Frankfurt','flag-de'],['sgp','Singapore','flag-sg'],['syd','Sydney','flag-au']];
const PROVS=[['github','Github'],['gitlab','Gitlab'],['bitbucket','Bitbucket']];
const DISK_RATE=0.2; // $ per GB
const WORKSPACES={github:['design-team-ux-testing','johndoe-personal'],gitlab:['johndoe-group'],bitbucket:['johndoe-workspace']};
const REPOS={'design-team-ux-testing':['Sample-node.js','Sample-node.js'],'johndoe-personal':['portfolio-api','express-starter','realtime-chat'],'johndoe-group':['node-api'],'johndoe-workspace':['billing-service']};

const S={view:'plan',plan:'starter',disk:10,serverName:'',region:'ny',prov:'github',connected:{},ws:null,repo:null};
const plan=()=>PLANS.find(p=>p.id===S.plan);
const monthly=()=>plan().price+S.disk*DISK_RATE;
const money=n=>'$'+n.toFixed(2);

/* ---------- views ---------- */
function plansView(){
  return `<div class="inner"><h1>Deploy your First Node JS Application</h1>
  <p class="lead">Select the type of application you want to deploy and pick a plan that fits your needs</p>
  <div class="stepl">Step 1 of 2</div>
  <div class="plans" role="radiogroup" aria-label="Plan">${PLANS.map(p=>`<button class="plan${p.id===S.plan?' on':''}" role="radio" aria-checked="${p.id===S.plan}" data-plan="${p.id}">
    <div class="pnm">${p.name}${p.pill?`<span class="pill">${p.pill}</span>`:''}</div><div class="pp">$${p.price}<small>/month</small></div>
    <div class="sp"><span>vCPUs:<b>${p.cpu}</b></span><span>RAM:<b>${p.ram} GB</b></span><span>CDN Bandwidth:<b>${p.cdn} GB</b></span><span>Network:<b>Up to 10 Gbps</b></span></div></button>`).join('')}</div>
  <div class="incl"><div><h4>All Plan Includes</h4><div class="l"><span>${CHECK}Enterprise CDN</span><span>${CHECK}DDOS Protection</span><span>${CHECK}Malware Protection</span></div></div><span class="sep"></span>
    <div class="chg"><h4>Additional Charges</h4><p>$0.033/GB for offsite backup storage <i></i> $0.02/GB for additional CDN bandwidth</p></div></div>
  <div class="disk"><h3>Choose Disk Space</h3><p>Please select your disk size. You can always scale your server size whenever required.</p>
    <div class="dr"><div class="rw"><input type="range" id="rng" min="1" max="1000" value="${S.disk}" aria-label="Disk space in GB" style="--p:${(S.disk-1)/9.99}%"><div class="rl"><span>1 GB</span><span>1000 GB</span></div></div>
      <div class="dnum"><input id="num" type="number" min="1" max="1000" value="${S.disk}" aria-label="Disk space in GB"> GB</div></div></div>
  <p class="imp">Important: Please note that scaling up your disk space is an irreversible action. Once increased disk space cannot be reduced or downgraded. However, your plan can still be downgraded at any time.</p></div>`;
}
function regionView(){
  return `<div class="inner"><h1>Deploy your First Node JS Application</h1>
  <p class="lead">Select the type of application you want to deploy and pick a plan that fits your needs</p>
  <div class="stepl"><button class="back" data-go="plan"><img src="${V}arrow-b.svg" alt="" style="transform:rotate(180deg)">Back</button><span class="vr"></span>Step 2 of 2</div>
  <div class="f" id="f-name"><label for="sname">Server Name</label><input class="in" id="sname" value="${esc(S.serverName)}" placeholder="Enter your server name" maxlength="60" autocomplete="off"><p class="msg">Give your server a name.</p></div>
  <div class="f"><div class="t">Select Region</div><p class="s">Choose a server location closest to your target audience for faster load times and better performance.</p>
    <div class="regs" role="radiogroup" aria-label="Region">${REGIONS.map(([k,n,f])=>`<button class="reg${k===S.region?' on':''}" role="radio" aria-checked="${k===S.region}" data-region="${k}"><img src="${O}${f}.svg" alt="">${n}</button>`).join('')}</div></div></div>`;
}
function gitView(){
  const p=S.prov,conn=S.connected[p],name=PROVS.find(x=>x[0]===p)[1];
  let body;
  if(!conn){
    body=`<div class="empty"><img src="${V}folder.svg" alt=""><h4>Connect ${name}</h4><p>Link your Git repository to easily manage your Node.js application. This integration enables code pulls, change tracking, and efficient deployments.</p><button class="cn" data-connect>Connect</button></div>`;
  }else{
    const wss=WORKSPACES[p],ws=S.ws&&wss.includes(S.ws)?S.ws:wss[0],repos=REPOS[ws];
    body=`<div class="acct"><div><span class="av"><img src="${V}person.svg" alt=""></span>Johndoe-cloudways</div><button data-disconnect aria-label="Disconnect ${name}"><img src="${V}more.svg" alt=""></button></div>
    <div class="wsh"><b>Workspace</b><button data-refresh aria-label="Refresh workspaces"><img src="${V}refresh.svg" alt=""></button></div>
    <div class="sel"><select id="ws" aria-label="Workspace">${wss.map(w=>`<option${w===ws?' selected':''}>${w}</option>`).join('')}</select><img src="${V}dropdown.svg" alt=""></div>
    <div class="rc"><span>${repos.length} ${repos.length===1?'repository':'repositories'}</span><button aria-label="Search repositories"><img src="${V}search.svg" alt=""></button></div>
    <div class="repos" role="radiogroup" aria-label="Repository">${repos.map((r,i)=>`<button class="repo${S.repo===ws+'/'+i?' on':''}" role="radio" aria-checked="${S.repo===ws+'/'+i}" data-repo="${esc(ws)}/${i}"><img src="${V}${p==='github'?'github-sm':p}.${p==='bitbucket'?'png':'svg'}" alt="">${esc(r)}</button>`).join('')}</div>`;
  }
  return `<div class="inner narrow"><h1 style="font-size:16px;line-height:24px">Deploy Your NodeJS Application</h1><p class="lead" style="font-size:13px;line-height:20px;margin-top:4px">Get started by linking your repository to enable a smooth development workflow.</p>
  <section class="gbox"><div class="t">Provider</div><p class="s">Name your application, choose your preferred region, and optionally add a custom domain.</p>
  <div class="provs" role="radiogroup" aria-label="Git provider">${PROVS.map(([k,n])=>`<button class="prov${k===p?' on':''}" role="radio" aria-checked="${k===p}" data-prov="${k}"><img src="${V}${k}.${k==='bitbucket'?'png':'svg'}" alt="">${n}${S.connected[k]?`<span class="ok"><img src="${V}ok-ring.svg" alt=""><img src="${V}ok-check.svg" alt=""></span>`:''}</button>`).join('')}</div>${body}</section></div>`;
}

/* ---------- footers ---------- */
function planFoot(next,label,arrow){
  const p=plan();
  return `<div class="sel-plan"><div class="l">Your selected plan:<b>${p.name}</b></div><span class="v"></span>
    <div class="spec"><div><span>RAM: <b>${p.ram} GB</b></span><span>Disk: <b>${S.disk} GB</b></span></div><div><span>CPU: <b>${p.cpu} Core Processor</b></span><span>Bandwidth: <b>${p.cdn} GB</b></span></div></div></div>
  <div class="fr"><div class="pr"><b>${money(monthly())}</b>Monthly</div><button class="cta" id="next">${label}${arrow?`<img src="${V}arrow-w.svg" alt="">`:''}</button></div>`;
}
function gitFoot(){
  return `<button class="gback" data-go="region"><img src="${V}arrow-b.svg" alt="" style="transform:rotate(180deg)">Back</button><button class="cta" id="next" ${S.repo?'':'disabled'}>Continue<img src="${V}arrow-w.svg" alt=""></button>`;
}

function render(){
  const st=$('#stage'),ft=$('#foot');
  if(S.view==='plan'){st.innerHTML=plansView();ft.className='foot';ft.innerHTML=planFoot('region','Continue',false)}
  else if(S.view==='region'){st.innerHTML=regionView();ft.className='foot';ft.innerHTML=planFoot('git','Launch Server',false)}
  else{st.innerHTML=gitView();ft.className='foot g';ft.innerHTML=gitFoot()}
  st.scrollTop=0;
  document.title=S.view==='git'?'Deploy your NodeJS application · Cloudways Velocity':'Deploy your first Node.js application · Cloudways Velocity';
}
function refreshFoot(){ // keep inputs focused while the footer totals change
  const ft=$('#foot');ft.innerHTML=planFoot('region','Continue',false);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-plan],[data-region],[data-go],[data-prov],[data-connect],[data-disconnect],[data-refresh],[data-repo],#next');if(!t)return;
  const d=t.dataset;
  if(d.plan){S.plan=d.plan;render();return}
  if(d.region){S.region=d.region;render();return}
  if(d.go){S.view=d.go;render();return}
  if(d.prov){S.prov=d.prov;S.repo=null;S.ws=null;render();return}
  if('connect' in d){openAuth();return}
  if('disconnect' in d){delete S.connected[S.prov];S.repo=null;render();return}
  if('refresh' in d){toast('Workspaces refreshed');return}
  if(d.repo){S.repo=d.repo;render();return}
  if(t.id==='next')advance();
});
document.addEventListener('input',e=>{
  const i=e.target;
  if(i.id==='rng'||i.id==='num'){
    let v=Math.max(1,Math.min(1000,parseInt(i.value,10)||1));
    if(i.id==='rng'){S.disk=v;$('#num').value=v}else if(i.value!==''){S.disk=v;$('#rng').value=v}
    $('#rng').style.setProperty('--p',((S.disk-1)/9.99)+'%');refreshFoot();
  }
  if(i.id==='sname'){S.serverName=i.value;$('#f-name').classList.remove('err')}
});
document.addEventListener('change',e=>{
  if(e.target.id==='num'){e.target.value=S.disk}
  if(e.target.id==='ws'){S.ws=e.target.value;S.repo=null;render()}
});

function advance(){
  if(S.view==='plan'){S.view='region';render();return}
  if(S.view==='region'){
    if(!S.serverName.trim()){$('#f-name').classList.add('err');$('#sname').focus();return}
    overlay(`Launching ${esc(S.serverName.trim())}…`,`Creating your ${plan().name} server in ${REGIONS.find(r=>r[0]===S.region)[1]}.`,1600,()=>{S.view='git';render()});return}
  if(S.view==='git'){
    const [ws,i]=S.repo.split('/'),repo=REPOS[ws][+i];
    try{sessionStorage.setItem('cw_velocity',JSON.stringify({server:S.serverName.trim(),plan:S.plan,region:S.region,repo,ws}))}catch{}
    overlay(`Deploying ${esc(repo)}…`,`Building your Node.js app and publishing it on ${esc(S.serverName.trim())}.`,2200,()=>{location.href='index.html#vel'})}
}
function overlay(h,p,ms,done){
  const o=document.createElement('div');o.className='launch';o.setAttribute('role','status');
  o.innerHTML=`<div class="spin"></div><h2>${h}</h2><p>${p}</p>`;document.body.appendChild(o);
  setTimeout(()=>{o.remove();done()},ms);
}
function toast(t){const e=document.createElement('div');e.setAttribute('role','status');e.textContent=t;e.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#253858;color:#fff;font-size:13px;padding:10px 18px;border-radius:4px;z-index:50';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* provider sign-in (prototype stand-in for the real OAuth popup; nothing is read or sent) */
function openAuth(){
  const k=S.prov,name=PROVS.find(x=>x[0]===k)[1];
  const s=document.createElement('div');s.className='scrim';s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');s.setAttribute('aria-label',`Sign in to ${name}`);
  s.innerHTML=`<div class="win"><div class="wb"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>Sign in to ${name}</span></div>
  <div class="url">${k}.com/login?integration=cloudways</div>
  <div class="gh"><div class="lg"><span>CLOUD<br>WAYS</span></div><h5>Sign in to <b>${name}</b><br>to continue to <b>Cloudways</b></h5>
  <form id="ghf"><label for="u">Username or email address</label><input id="u" autocomplete="off"><label for="p">Password <a href="#" onclick="return false">Forgot password?</a></label><input id="p" type="password" autocomplete="off"><button class="si" type="submit">Sign in</button></form>
  <div class="or">or</div><button class="alt" data-ok type="button">Continue with Google</button><button class="alt" data-ok type="button">Continue with Apple</button>
  <small>New to ${name}? <a href="#" onclick="return false">Create an account</a></small><p class="pn">Prototype: this stand-in sign-in doesn’t read or send anything.</p></div></div>`;
  document.body.appendChild(s);$('#u').focus();
  const done=()=>{s.remove();S.connected[k]=true;S.ws=null;S.repo=null;render()};
  s.addEventListener('click',e=>{if(e.target===s)s.remove();if(e.target.closest('[data-ok]'))done()});
  $('#ghf').addEventListener('submit',e=>{e.preventDefault();done()});
  s.addEventListener('keydown',e=>{if(e.key==='Escape')s.remove()});
}
render();
</script>
</body>
</html>
